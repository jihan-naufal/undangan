<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan Jihan & Naufal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow-x: hidden; }

    /* AMPLOP COVER */
    #envelope-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('cover%20htlm%20(1).jpg') no-repeat center center / contain;
      background-color: #cfd8dc;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      z-index: 999;
      text-align: center;
      padding-top: 72vh;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
    }

    .envelope-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 240px;
      width: 80%;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .yth-text { font-size: 11px; color: #e2e8f0; margin-bottom: 6px; }

    .guest-box {
      margin: 2px 0 8px 0;
      padding: 2px 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    #guest-name { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: #ffffff; }

    .open-btn {
      padding: 7px 18px; font-size: 11px; text-transform: uppercase;
      background: rgba(0, 0, 0, 0.5); color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
      cursor: pointer; font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .apology-text {
      font-size: 9.5px;
      color: #cbd5e1;
      margin-top: 10px;
      font-style: italic;
      line-height: 1.35;
      text-align: center;
    }

    .hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

    /* WAPPER CANVA AGAR PROPORSI & ANIMASI RAPI DI HP */
    #canva-wrapper {
      display: none;
      width: 100%;
      max-width: 500px; /* Lebar maksimal layaknya layar HP ideal */
      margin: 0 auto;
      min-height: 100vh;
    }

    .canva-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 177.78%; /* Rasio 9:16 khusus HP agar slide Canva pas per halaman */
      overflow: hidden;
    }

    .canva-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      #envelope-screen { background-size: cover; padding-top: 68vh; }
      .envelope-content { max-width: 200px; }
      #guest-name { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- COVER AMPLOP -->
  <div id="envelope-screen">
    <div class="envelope-content">
      <p class="yth-text">Kepada Yth.<br>Bapak/Ibu/Saudara/i:</p>
      <div class="guest-box">
        <h1 id="guest-name">Nama Tamu</h1>
      </div>
      <button class="open-btn" onclick="openInvitation()">Buka Undangan</button>
      <p class="apology-text">Mohon maaf apabila ada kesalahan penulisan nama, gelar, dan tempat.</p>
    </div>
  </div>

  <!-- LAGU -->
  <audio id="bg-music" loop preload="auto">
    <source src="Lagu.mp3" type="audio/mpeg">
  </audio>

  <!-- CANVA EMBED (DENGAN PEMBUNGKUS RAPI) -->
  <div id="canva-wrapper">
    <div class="canva-container">
      <iframe src="https://www.canva.com/design/DAHT1haiPlI/Q5fHgm8Q782H7SKQk5Cfiw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>
  </div>

  <script>
    // Ambil nama dari link ?to=
    const urlParams = new URLSearchParams(window.location.search);
    const guest = urlParams.get('to');
    if (guest) {
      document.getElementById('guest-name').textContent = decodeURIComponent(guest);
    }

    // Buka undangan
    function openInvitation() {
      document.getElementById('envelope-screen').classList.add('hidden');
      document.getElementById('canva-wrapper').style.display = 'block';
      document.getElementById('bg-music').play().catch(() => {});
    }
  </script>
</body>
</html>
