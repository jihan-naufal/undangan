<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan Jihan & Naufal</title>
  
  <!-- Font Estetis untuk Undangan -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: 'Cormorant Garamond', serif; overflow: hidden; background: #1a1a1a; }

    /* KODE UNTUK SEMBUNYIKAN BADGE / MARK NETLIFY */
    .netlify-badge,
    [data-netlify-badge],
    iframe[src*="netlify"],
    div[class*="netlify-badge"],
    a[href*="netlify.com"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Cover Utama - Memanggil file cover htlm (1).jpg */
    #envelope-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('cover%20htlm%20(1).jpg') no-repeat center center / contain;
      background-color: #cfd8dc;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      z-index: 999;
      text-align: center;
      padding-top: 72vh; /* Mengatur posisi kotak tepat di bawah amplop */
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease-in-out;
    }

    /* Penyesuaian khusus layar HP */
    @media (max-width: 768px) {
      #envelope-screen {
        background-size: cover;
        padding-top: 68vh;
      }
    }

    /* Kotak Teks Ringkas & Presisi */
    .envelope-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 240px;
      width: 80%;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .yth-text {
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      font-family: sans-serif;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    /* Garis bawah nama tamu diganti hitam transparan */
    .guest-box {
      margin: 2px 0 8px 0;
      padding: 2px 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    #guest-name {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      word-wrap: break-word;
      line-height: 1.2;
    }

    /* Tombol Buka Undangan diganti hitam semi-transparan */
    .open-btn {
      padding: 7px 18px;
      font-size: 11px;
      font-family: sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .open-btn:hover {
      transform: scale(1.05);
      background: rgba(0, 0, 0, 0.7);
    }

    /* Container Canva */
    #canva-container {
      width: 100%;
      height: 100vh;
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Layar Cover & Amplop -->
  <div id="envelope-screen">
    <div class="envelope-content">
      <p class="yth-text">Kepada Yth.<br>Bapak/Ibu/Saudara/i:</p>
      <div class="guest-box">
        <h1 id="guest-name">Nama Tamu</h1>
      </div>
      <button class="open-btn" onclick="openInvitation()">Buka Undangan</button>
    </div>
  </div>

  <!-- Audio Background -->
  <audio id="bg-music" loop preload="auto">
    <source src="Lagu.mp3" type="audio/mpeg">
  </audio>

  <!-- Embed Canva Baru -->
  <div id="canva-container">
    <iframe src="https://www.canva.com/design/DAHT1haiPlI/Q5fHgm8Q782H7SKQk5Cfiw/view?embed" allowfullscreen></iframe>
  </div>

  <script>
    // 1. Ambil Nama Tamu dari URL Parameter (?to=Nama)
    const urlParams = new URLSearchParams(window.location.search);
    const guest = urlParams.get('to');
    if (guest) {
      document.getElementById('guest-name').textContent = decodeURIComponent(guest);
    }

    // 2. Fungsi Buka Amplop & Putar Musik
    function openInvitation() {
      const envelope = document.getElementById('envelope-screen');
      const music = document.getElementById('bg-music');
      
      // Sembunyikan amplop
      envelope.classList.add('hidden');
      
      // Putar lagu
      music.play().catch(error => console.log("Autoplay terhalang browser:", error));
    }

    // 3. Script Otomatis Menghapus Elemen Badge Netlify
    window.addEventListener('DOMContentLoaded', () => {
      const removeNetlifyBadge = () => {
        const badges = document.querySelectorAll('.netlify-badge, [data-netlify-badge]');
        badges.forEach(b => b.remove());
      };
      removeNetlifyBadge();
      setInterval(removeNetlifyBadge, 500);
    });
  </script>
</body>
</html>
